name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install .NET MAUI workload
        run: dotnet workload install maui

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build standalone Windows installer
        shell: cmd
        run: |
          set "EEE_INSTALLER_OUTPUT_DIR=%GITHUB_WORKSPACE%\Platforms\installer"
          call devrunners\buildwindowsinstaller2.bat

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ee-engine-windows-installer
          path: Platforms/installer/EEE-Setup.exe
          if-no-files-found: error

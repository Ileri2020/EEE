name: Build Android

on:
  push:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36 and Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install .NET MAUI workload
        run: dotnet workload install maui-android

      - name: Publish Android APK
        run: >-
          dotnet publish EEE.csproj
          -f net10.0-android
          -c Release
          --artifacts-path Platforms/dist
          -p:PublishReadyToRun=false
          -p:PublishTrimmed=false
          -p:RunAOTCompilation=false
          -p:AndroidPackageFormats=apk
          -p:RuntimeIdentifiers=android-x64

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: eee-android-apk
          path: Platforms/dist/publish/EEE/release_net10.0-android/*.apk
          if-no-files-found: error

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -25 50 50" width="50" height="50">
  <!-- CMOS Bilateral Transmission Gate (Parallel NMOS + PMOS) -->
  <!-- Signal in/out leads -->
  <line x1="-20" y1="0" x2="-12" y2="0" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="-20" cy="0" r="2.5" fill="#58A6FF"/>
  <line x1="12" y1="0" x2="20" y2="0" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="20" cy="0" r="2.5" fill="#58A6FF"/>
  <!-- Complementary triangles (bilateral transmission gate) -->
  <polygon points="-12,-8 12,-8 0,6" fill="#1C2128" stroke="#D2A8FF" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="-12,8 12,8 0,-6" fill="#1C2128" stroke="#D2A8FF" stroke-width="2" stroke-linejoin="round"/>
  <!-- Top active-high control line (Ctrl) -->
  <line x1="0" y1="-18" x2="0" y2="-9" stroke="#56D364" stroke-width="2" stroke-linecap="round"/>
  <circle cx="0" cy="-18" r="2" fill="#56D364"/>
  <!-- Bottom active-low control line with inversion bubble (Ctrl_inv) -->
  <circle cx="0" cy="11" r="2" fill="none" stroke="#F78166" stroke-width="1.8"/>
  <line x1="0" y1="13" x2="0" y2="18" stroke="#F78166" stroke-width="2" stroke-linecap="round"/>
  <circle cx="0" cy="18" r="2" fill="#F78166"/>
</svg>

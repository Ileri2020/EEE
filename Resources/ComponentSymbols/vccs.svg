<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -25 60 50" width="60" height="50">
  <!-- VCCS: Voltage-Controlled Current Source (Diamond with arrow) -->
  <!-- Control leads (input) -->
  <line x1="-24" y1="-10" x2="-10" y2="-10" stroke="#56D364" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="-24" y1="10" x2="-10" y2="10" stroke="#56D364" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Output leads -->
  <line x1="10" y1="-10" x2="24" y2="-10" stroke="#56D364" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="10" y1="10" x2="24" y2="10" stroke="#56D364" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Central Diamond Body -->
  <polygon points="0,-14 14,0 0,14 -14,0" fill="#161B22" stroke="#56D364" stroke-width="2" stroke-linejoin="round"/>
  <!-- Arrow downwards inside -->
  <line x1="0" y1="-7" x2="0" y2="7" stroke="#56D364" stroke-width="1.8" stroke-linecap="round"/>
  <polyline points="-3,3 0,7 3,3" fill="none" stroke="#56D364" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Terminals -->
  <circle cx="-24" cy="-10" r="2" fill="#58A6FF"/>
  <circle cx="-24" cy="10" r="2" fill="#58A6FF"/>
  <circle cx="24" cy="-10" r="2" fill="#58A6FF"/>
  <circle cx="24" cy="10" r="2" fill="#58A6FF"/>
</svg>

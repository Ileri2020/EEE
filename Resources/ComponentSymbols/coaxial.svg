<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -25 60 50" width="60" height="50">
  <!-- Coaxial Cable Transmission Line (Concentric Shield + Core) -->
  <!-- Port 1 (Input Left) -->
  <line x1="-24" y1="-10" x2="-14" y2="-10" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="-24" y1="10" x2="-14" y2="10" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>
  <!-- Port 2 (Output Right) -->
  <line x1="14" y1="-10" x2="24" y2="-10" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="10" x2="24" y2="10" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>
  <!-- Outer cable cylinder body -->
  <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#161B22" stroke="#79C0FF" stroke-width="2"/>
  <!-- Concentric circles representing coaxial geometry -->
  <circle cx="0" cy="0" r="9" fill="#1C2128" stroke="#8B949E" stroke-width="1.8"/>
  <circle cx="0" cy="0" r="4" fill="#79C0FF"/>
  <!-- Terminals -->
  <circle cx="-24" cy="-10" r="2" fill="#58A6FF"/>
  <circle cx="-24" cy="10" r="2" fill="#8B949E"/>
  <circle cx="24" cy="-10" r="2" fill="#58A6FF"/>
  <circle cx="24" cy="10" r="2" fill="#8B949E"/>
</svg>

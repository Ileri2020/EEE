<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -25 60 50" width="60" height="50">
  <!-- PMOS: P-Channel MOSFET with Gate Inversion Bubble and Outward Substrate Arrow -->
  <!-- Gate lead with inversion bubble before gate bar -->
  <line x1="-25" y1="0" x2="-11" y2="0" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="-8.5" cy="0" r="2.5" fill="#161B22" stroke="#D2A8FF" stroke-width="1.8"/>
  <line x1="-6" y1="-14" x2="-6" y2="14" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Channel segments -->
  <line x1="-1" y1="-14" x2="-1" y2="-6" stroke="#D2A8FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-1" y1="-4" x2="-1" y2="4" stroke="#D2A8FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-1" y1="6" x2="-1" y2="14" stroke="#D2A8FF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Drain lead -->
  <line x1="-1" y1="-10" x2="16" y2="-20" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="-20" x2="25" y2="-20" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Source lead -->
  <line x1="-1" y1="10" x2="16" y2="20" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="20" x2="25" y2="20" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Substrate lead with OUTWARD arrow (away from channel towards source tie) -->
  <line x1="-1" y1="0" x2="16" y2="0" stroke="#D2A8FF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="0" x2="16" y2="20" stroke="#D2A8FF" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="10,0 3,-3.5 3,3.5" fill="#D2A8FF"/>
  <!-- Terminals -->
  <circle cx="-25" cy="0" r="2.5" fill="#58A6FF"/>
  <circle cx="25" cy="-20" r="2.5" fill="#58A6FF"/>
  <circle cx="25" cy="20" r="2.5" fill="#58A6FF"/>
</svg>

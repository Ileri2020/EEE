<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -22 64 44" width="64" height="44">
  <!-- AC Transformer: two coupled coils, horizontal -->
  <!-- Left leads (primary) -->
  <line x1="-30" y1="-8" x2="-20" y2="-8" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="-30" y1="8" x2="-20" y2="8" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Right leads (secondary) -->
  <line x1="20" y1="-8" x2="30" y2="-8" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="8" x2="30" y2="8" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Primary coil arcs -->
  <path d="M-20,-8 A5,5 0 0,1 -10,-8" fill="none" stroke="#D2A8FF" stroke-width="2"/>
  <path d="M-10,-8 A5,5 0 0,1 0,-8" fill="none" stroke="#D2A8FF" stroke-width="2"/>
  <!-- Secondary coil arcs (mirrored) -->
  <path d="M10,-8 A5,5 0 0,0 20,-8" fill="none" stroke="#D2A8FF" stroke-width="2"/>
  <path d="M0,-8 A5,5 0 0,0 10,-8" fill="none" stroke="#D2A8FF" stroke-width="2"/>
  <!-- Core line -->
  <line x1="-1" y1="-14" x2="-1" y2="14" stroke="#D2A8FF" stroke-width="1.5"/>
  <line x1="1" y1="-14" x2="1" y2="14" stroke="#D2A8FF" stroke-width="1.5"/>
  <!-- Dot convention markers -->
  <circle cx="-20" cy="-8" r="2" fill="#E3B341"/>
  <circle cx="20" cy="-8" r="2" fill="#E3B341"/>
  <!-- Terminal dots -->
  <circle cx="-30" cy="-8" r="2.5" fill="#58A6FF"/>
  <circle cx="-30" cy="8" r="2.5" fill="#58A6FF"/>
  <circle cx="30" cy="-8" r="2.5" fill="#58A6FF"/>
  <circle cx="30" cy="8" r="2.5" fill="#58A6FF"/>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -25 60 50" width="60" height="50">
  <!-- BJT NPN: Base bar, collector lead, emitter lead with OUTWARD arrow -->
  <line x1="-25" y1="0" x2="-6" y2="0" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <line x1="-6" y1="-14" x2="-6" y2="14" stroke="#FFA657" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Collector (Top) -->
  <line x1="-6" y1="-7" x2="16" y2="-20" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="-20" x2="25" y2="-20" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <!-- Emitter (Bottom with outward arrow) -->
  <line x1="-6" y1="7" x2="16" y2="20" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="20" x2="25" y2="20" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <polygon points="16,20 8,16 12,11" fill="#FFA657"/>
  <!-- Terminals (Base, Collector, Emitter) -->
  <circle cx="-25" cy="0" r="2.5" fill="#58A6FF"/>
  <circle cx="25" cy="-20" r="2.5" fill="#58A6FF"/>
  <circle cx="25" cy="20" r="2.5" fill="#58A6FF"/>
</svg>

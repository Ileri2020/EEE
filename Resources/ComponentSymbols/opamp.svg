<svg xmlns="http://www.w3.org/2000/svg" viewBox="-35 -30 70 60" width="70" height="60">
  <!-- OpAmp: Triangle with non-inverting, inverting inputs and output -->
  <!-- Inputs -->
  <line x1="-30" y1="-10" x2="-20" y2="-10" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="-30" y1="10" x2="-20" y2="10" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Power rails -->
  <line x1="0" y1="-28" x2="0" y2="-14" stroke="#79C0FF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="0" y1="14" x2="0" y2="28" stroke="#79C0FF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Output -->
  <line x1="20" y1="0" x2="30" y2="0" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Triangle body -->
  <polygon points="-20,-22 20,0 -20,22" fill="#161B22" stroke="#79C0FF" stroke-width="2" stroke-linejoin="round"/>
  <!-- Minus and Plus signs -->
  <line x1="-16" y1="-10" x2="-10" y2="-10" stroke="#79C0FF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="-16" y1="10" x2="-10" y2="10" stroke="#79C0FF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="-13" y1="7" x2="-13" y2="13" stroke="#79C0FF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Terminals -->
  <circle cx="-30" cy="-10" r="2.5" fill="#58A6FF"/>
  <circle cx="-30" cy="10" r="2.5" fill="#58A6FF"/>
  <circle cx="30" cy="0" r="2.5" fill="#58A6FF"/>
</svg>

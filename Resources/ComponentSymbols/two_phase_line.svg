<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -26 64 52" width="64" height="52">
  <!-- Two-Phase Transmission Line -->
  <!-- Phase A - left leads -->
  <line x1="-30" y1="-10" x2="-18" y2="-10" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Phase B - left leads -->
  <line x1="-30" y1="10" x2="-18" y2="10" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Phase A - right leads -->
  <line x1="18" y1="-10" x2="30" y2="-10" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Phase B - right leads -->
  <line x1="18" y1="10" x2="30" y2="10" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Body box -->
  <rect x="-18" y="-20" width="36" height="40" rx="3" ry="3" fill="#161B22" stroke="#79C0FF" stroke-width="1.5"/>
  <!-- Phase A label -->
  <text x="0" y="-5" font-size="5" fill="#79C0FF" text-anchor="middle" font-family="monospace">A</text>
  <!-- Phase B label -->
  <text x="0" y="12" font-size="5" fill="#D2A8FF" text-anchor="middle" font-family="monospace">B</text>
  <!-- 2φ label -->
  <text x="0" y="21" font-size="5" fill="#79C0FF" text-anchor="middle" font-family="monospace">2φ</text>
  <!-- Terminal dots -->
  <circle cx="-30" cy="-10" r="2.5" fill="#58A6FF"/>
  <circle cx="-30" cy="10" r="2.5" fill="#58A6FF"/>
  <circle cx="30" cy="-10" r="2.5" fill="#58A6FF"/>
  <circle cx="30" cy="10" r="2.5" fill="#58A6FF"/>
</svg>


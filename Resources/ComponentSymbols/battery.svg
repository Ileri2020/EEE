<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -20 56 40" width="56" height="40">
  <!-- Battery: stacked cell plates with SOC fill and +/- terminals -->
  <!-- Positive terminal lead -->
  <line x1="18" y1="0" x2="26" y2="0" stroke="#56D364" stroke-width="2" stroke-linecap="round"/>
  <!-- Negative terminal lead -->
  <line x1="-26" y1="0" x2="-18" y2="0" stroke="#56D364" stroke-width="2" stroke-linecap="round"/>
  <!-- Battery outer body -->
  <rect x="-18" y="-12" width="36" height="24" rx="3" ry="3" fill="#161B22" stroke="#56D364" stroke-width="1.75"/>
  <!-- Positive cap (small nub on right) -->
  <rect x="18" y="-5" width="4" height="10" rx="2" ry="2" fill="#56D364"/>
  <!-- SOC fill (green fill from left) -->
  <rect x="-15" y="-8" width="22" height="16" rx="2" ry="2" fill="#56D364" opacity="0.35"/>
  <!-- Cell divider line -->
  <line x1="-5" y1="-12" x2="-5" y2="12" stroke="#56D364" stroke-width="1" opacity="0.6"/>
  <!-- + symbol on right cell -->
  <line x1="4" y1="0" x2="10" y2="0" stroke="#56D364" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="7" y1="-3" x2="7" y2="3" stroke="#56D364" stroke-width="1.75" stroke-linecap="round"/>
  <!-- – symbol on left cell -->
  <line x1="-14" y1="0" x2="-8" y2="0" stroke="#56D364" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Enable/control pin (bottom) -->
  <line x1="0" y1="12" x2="0" y2="20" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2,2"/>
  <!-- Terminal dots -->
  <circle cx="26" cy="0" r="2.5" fill="#58A6FF"/>
  <circle cx="-26" cy="0" r="2.5" fill="#58A6FF"/>
  <circle cx="0" cy="20" r="2" fill="#8B949E"/>
</svg>


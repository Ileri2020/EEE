<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -25 60 50" width="60" height="50">
  <!-- CurrentSwitch: Current-Controlled Switch -->
  <!-- Switch contacts and terminals (Horizontal) -->
  <line x1="-24" y1="0" x2="-8" y2="0" stroke="#E3B341" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="0" x2="24" y2="0" stroke="#E3B341" stroke-width="2" stroke-linecap="round"/>
  <circle cx="-7" cy="0" r="2.2" fill="#161B22" stroke="#E3B341" stroke-width="1.8"/>
  <circle cx="7" cy="0" r="2.2" fill="#161B22" stroke="#E3B341" stroke-width="1.8"/>
  <!-- Open Switch Lever -->
  <line x1="-6" y1="-2" x2="6" y2="-11" stroke="#E3B341" stroke-width="2" stroke-linecap="round"/>
  <!-- Current Control Loop / Terminals (Vertical) -->
  <line x1="0" y1="-22" x2="0" y2="-14" stroke="#D2A8FF" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="-11" r="3" fill="none" stroke="#D2A8FF" stroke-width="1.5"/>
  <line x1="0" y1="14" x2="0" y2="22" stroke="#D2A8FF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Terminals -->
  <circle cx="-24" cy="0" r="2" fill="#58A6FF"/>
  <circle cx="24" cy="0" r="2" fill="#58A6FF"/>
  <circle cx="0" cy="-22" r="2" fill="#58A6FF"/>
  <circle cx="0" cy="22" r="2" fill="#58A6FF"/>
</svg>

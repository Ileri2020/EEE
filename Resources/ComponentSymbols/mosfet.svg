<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -25 60 50" width="60" height="50">
  <!-- NMOS: N-Channel MOSFET with inward-pointing substrate arrow -->
  <!-- Gate lead & bar -->
  <line x1="-25" y1="0" x2="-8" y2="0" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="-8" y1="-14" x2="-8" y2="14" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Channel segments -->
  <line x1="-3" y1="-14" x2="-3" y2="-6" stroke="#D2A8FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-3" y1="-4" x2="-3" y2="4" stroke="#D2A8FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-3" y1="6" x2="-3" y2="14" stroke="#D2A8FF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Drain lead -->
  <line x1="-3" y1="-10" x2="16" y2="-20" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="-20" x2="25" y2="-20" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Source lead -->
  <line x1="-3" y1="10" x2="16" y2="20" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="20" x2="25" y2="20" stroke="#D2A8FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Substrate lead with inward arrow (towards channel) -->
  <line x1="14" y1="0" x2="-3" y2="0" stroke="#D2A8FF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="14" y1="0" x2="14" y2="20" stroke="#D2A8FF" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="-3,0 4,-3.5 4,3.5" fill="#D2A8FF"/>
  <!-- Terminals -->
  <circle cx="-25" cy="0" r="2.5" fill="#58A6FF"/>
  <circle cx="25" cy="-20" r="2.5" fill="#58A6FF"/>
  <circle cx="25" cy="20" r="2.5" fill="#58A6FF"/>
</svg>

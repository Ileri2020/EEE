<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -25 50 50" width="50" height="50">
  <!-- Pull Resistor (Pull-Up / Pull-Down) -->
  <!-- Top supply line / rail -->
  <line x1="-10" y1="-18" x2="10" y2="-18" stroke="#E3B341" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="-18" x2="0" y2="-12" stroke="#F78166" stroke-width="2"/>
  <!-- Zigzag resistor body -->
  <path d="M0 -12 L4 -9 L-4 -5 L4 -1 L-4 3 L4 7 L0 10" fill="none" stroke="#F78166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lead line to output terminal -->
  <line x1="0" y1="10" x2="0" y2="18" stroke="#F78166" stroke-width="2" stroke-linecap="round"/>
  <circle cx="0" cy="18" r="2.5" fill="#58A6FF"/>
  <!-- Direction arrow on side -->
  <path d="M10 2 L10 -8 M7 -5 L10 -8 L13 -5" fill="none" stroke="#E3B341" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

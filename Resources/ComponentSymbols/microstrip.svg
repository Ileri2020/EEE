<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -25 60 50" width="60" height="50">
  <!-- PCB Microstrip Planar Transmission Line -->
  <!-- Port 1 (Input Left) -->
  <line x1="-24" y1="-8" x2="-14" y2="-8" stroke="#56D364" stroke-width="2" stroke-linecap="round"/>
  <line x1="-24" y1="12" x2="-14" y2="12" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>
  <!-- Port 2 (Output Right) -->
  <line x1="14" y1="-8" x2="24" y2="-8" stroke="#56D364" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="12" x2="24" y2="12" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>
  <!-- Substrate slab -->
  <rect x="-14" y="-3" width="28" height="12" rx="2" fill="#21262D" stroke="#30363D" stroke-width="1.5"/>
  <!-- Top conductor microstrip trace -->
  <rect x="-14" y="-8" width="28" height="5" rx="1" fill="#56D364" stroke="#56D364" stroke-width="1"/>
  <!-- Bottom continuous ground plane -->
  <line x1="-14" y1="11" x2="14" y2="11" stroke="#8B949E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Terminals -->
  <circle cx="-24" cy="-8" r="2" fill="#58A6FF"/>
  <circle cx="-24" cy="12" r="2" fill="#8B949E"/>
  <circle cx="24" cy="-8" r="2" fill="#58A6FF"/>
  <circle cx="24" cy="12" r="2" fill="#8B949E"/>
</svg>

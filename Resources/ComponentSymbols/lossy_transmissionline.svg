<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -25 60 50" width="60" height="50">
  <!-- Lossy Transmission Line (RLGC Distributed Model) -->
  <!-- Port 1 (Input Left) -->
  <line x1="-24" y1="-10" x2="-14" y2="-10" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <line x1="-24" y1="10" x2="-14" y2="10" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <!-- Port 2 (Output Right) -->
  <line x1="14" y1="-10" x2="24" y2="-10" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="10" x2="24" y2="10" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <!-- Body enclosure -->
  <rect x="-14" y="-13" width="28" height="26" rx="4" fill="#161B22" stroke="#FFA657" stroke-width="2"/>
  <!-- Internal distributed R-L-G-C representation -->
  <!-- Resistor zigzag / inductor coil line on top -->
  <path d="M-10 -7 L-6 -9 L-2 -5 L2 -9 L6 -5 L10 -7" fill="none" stroke="#F78166" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom reference line -->
  <line x1="-10" y1="7" x2="10" y2="7" stroke="#79C0FF" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Shunt C/G in center -->
  <line x1="0" y1="-4" x2="0" y2="0" stroke="#56D364" stroke-width="1.4"/>
  <line x1="-4" y1="0" x2="4" y2="0" stroke="#56D364" stroke-width="1.4"/>
  <line x1="-4" y1="3" x2="4" y2="3" stroke="#56D364" stroke-width="1.4"/>
  <line x1="0" y1="3" x2="0" y2="7" stroke="#56D364" stroke-width="1.4"/>
  <!-- Terminals -->
  <circle cx="-24" cy="-10" r="2" fill="#58A6FF"/>
  <circle cx="-24" cy="10" r="2" fill="#58A6FF"/>
  <circle cx="24" cy="-10" r="2" fill="#58A6FF"/>
  <circle cx="24" cy="10" r="2" fill="#58A6FF"/>
</svg>

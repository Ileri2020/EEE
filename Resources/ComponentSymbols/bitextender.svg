<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -25 50 50" width="50" height="50">
  <!-- Bit Extender Component -->
  <!-- Input lead -->
  <line x1="-20" y1="0" x2="-14" y2="0" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="-20" cy="0" r="2.5" fill="#58A6FF"/>
  <!-- Output lead with bus slash mark -->
  <line x1="14" y1="0" x2="20" y2="0" stroke="#79C0FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="-3" x2="18" y2="3" stroke="#E3B341" stroke-width="1.8"/>
  <circle cx="20" cy="0" r="2.5" fill="#58A6FF"/>
  <!-- Trapezoidal extender body (expanding left to right) -->
  <polygon points="-14,-8 14,-14 14,14 -14,8" fill="#161B22" stroke="#58A6FF" stroke-width="2" stroke-linejoin="round"/>
  <!-- Bit extension symbol / label -->
  <text x="0" y="3" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#79C0FF" text-anchor="middle">EXT</text>
</svg>

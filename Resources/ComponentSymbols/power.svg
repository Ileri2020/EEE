<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -25 50 50" width="50" height="50">
  <!-- Positive Supply Rail (+VCC) -->
  <line x1="0" y1="18" x2="0" y2="-4" stroke="#56D364" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Upward power arrow or T-bar bar -->
  <path d="M-12 -4 L0 -16 L12 -4" fill="none" stroke="#56D364" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- VCC label text -->
  <text x="0" y="-18" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#56D364" text-anchor="middle">+VCC</text>
  <!-- Lead connection terminal at bottom -->
  <circle cx="0" cy="18" r="2.5" fill="#58A6FF"/>
</svg>

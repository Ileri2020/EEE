<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -25 60 50" width="60" height="50">
  <!-- LED: Diode body with emission rays -->
  <line x1="-25" y1="0" x2="-8" y2="0" stroke="#FF7B72" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="0" x2="25" y2="0" stroke="#FF7B72" stroke-width="2" stroke-linecap="round"/>
  <polygon points="-8,-10 8,0 -8,10" fill="#FF7B72" stroke="#FF7B72" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="8" y1="-10" x2="8" y2="10" stroke="#FF7B72" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Light emission arrows -->
  <line x1="3" y1="-12" x2="11" y2="-19" stroke="#E3B341" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="7,-19 11,-19 11,-15" fill="none" stroke="#E3B341" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="8" y1="-8" x2="16" y2="-15" stroke="#E3B341" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="12,-15 16,-15 16,-11" fill="none" stroke="#E3B341" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Terminals -->
  <circle cx="-25" cy="0" r="2.5" fill="#58A6FF"/>
  <circle cx="25" cy="0" r="2.5" fill="#58A6FF"/>
</svg>

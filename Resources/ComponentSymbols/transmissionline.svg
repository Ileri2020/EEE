<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -25 60 50" width="60" height="50">
  <!-- Lossless Transmission Line (T) -->
  <!-- Port 1 (Input Left) -->
  <line x1="-24" y1="-10" x2="-14" y2="-10" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="-24" y1="10" x2="-14" y2="10" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Port 2 (Output Right) -->
  <line x1="14" y1="-10" x2="24" y2="-10" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="10" x2="24" y2="10" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Coaxial / Cable Body -->
  <rect x="-14" y="-12" width="28" height="24" rx="4" fill="#161B22" stroke="#79C0FF" stroke-width="2"/>
  <!-- Internal T-Line delay symbol (helical waves / twin conductor) -->
  <line x1="-12" y1="-5" x2="12" y2="-5" stroke="#58A6FF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="-12" y1="5" x2="12" y2="5" stroke="#58A6FF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center Z0 indicator -->
  <ellipse cx="0" cy="0" rx="4" ry="7" fill="none" stroke="#79C0FF" stroke-width="1.2"/>
  <!-- Terminals -->
  <circle cx="-24" cy="-10" r="2" fill="#58A6FF"/>
  <circle cx="-24" cy="10" r="2" fill="#58A6FF"/>
  <circle cx="24" cy="-10" r="2" fill="#58A6FF"/>
  <circle cx="24" cy="10" r="2" fill="#58A6FF"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -25 50 50" width="50" height="50">
  <!-- Voltage / Current Probe Point -->
  <line x1="-18" y1="0" x2="-8" y2="0" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="-18" cy="0" r="2.5" fill="#58A6FF"/>
  <!-- Probe indicator body -->
  <circle cx="4" cy="0" r="14" fill="#161B22" stroke="#79C0FF" stroke-width="2"/>
  <!-- Oscilloscope / Meter 'V' indicator -->
  <text x="4" y="4" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#56D364" text-anchor="middle">V</text>
  <!-- Outer measurement ray ticks -->
  <circle cx="4" cy="0" r="16.5" fill="none" stroke="#58A6FF" stroke-width="1" stroke-dasharray="2,3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -25 60 50" width="60" height="50">
  <!-- Voltage Delay Element (VD) -->
  <!-- Controlling Input (Left) -->
  <line x1="-24" y1="-10" x2="-14" y2="-10" stroke="#56D364" stroke-width="2" stroke-linecap="round"/>
  <line x1="-24" y1="10" x2="-14" y2="10" stroke="#56D364" stroke-width="2" stroke-linecap="round"/>
  <!-- Delayed Output (Right) -->
  <line x1="14" y1="-10" x2="24" y2="-10" stroke="#56D364" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="10" x2="24" y2="10" stroke="#56D364" stroke-width="2" stroke-linecap="round"/>
  <!-- Block Body -->
  <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#161B22" stroke="#56D364" stroke-width="2"/>
  <!-- Clock / Delay tau symbol inside -->
  <circle cx="0" cy="0" r="7" fill="none" stroke="#56D364" stroke-width="1.5"/>
  <line x1="0" y1="0" x2="0" y2="-4.5" stroke="#56D364" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="0" y1="0" x2="3.5" y2="0" stroke="#56D364" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Terminals -->
  <circle cx="-24" cy="-10" r="2" fill="#58A6FF"/>
  <circle cx="-24" cy="10" r="2" fill="#58A6FF"/>
  <circle cx="24" cy="-10" r="2" fill="#58A6FF"/>
  <circle cx="24" cy="10" r="2" fill="#58A6FF"/>
</svg>

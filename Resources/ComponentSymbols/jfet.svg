<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -25 60 50" width="60" height="50">
  <!-- JFET: Junction Field-Effect Transistor (N-Channel) -->
  <!-- Gate lead with arrow pointing towards channel bar -->
  <line x1="-24" y1="0" x2="-6" y2="0" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <polygon points="-6,0 -12,-4 -12,4" fill="#FFA657"/>
  <!-- Channel Bar -->
  <line x1="-6" y1="-14" x2="-6" y2="14" stroke="#FFA657" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Drain -->
  <line x1="-6" y1="-9" x2="14" y2="-18" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="-18" x2="24" y2="-18" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <!-- Source -->
  <line x1="-6" y1="9" x2="14" y2="18" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="18" x2="24" y2="18" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <!-- Terminals (Gate, Drain, Source) -->
  <circle cx="-24" cy="0" r="2" fill="#58A6FF"/>
  <circle cx="24" cy="-18" r="2" fill="#58A6FF"/>
  <circle cx="24" cy="18" r="2" fill="#58A6FF"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -22 64 44" width="64" height="44">
  <!-- Single-Phase Transmission Line: π-section model symbol -->
  <!-- Left lead -->
  <line x1="-30" y1="0" x2="-18" y2="0" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Right lead -->
  <line x1="18" y1="0" x2="30" y2="0" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Main body box -->
  <rect x="-18" y="-12" width="36" height="24" rx="3" ry="3" fill="#161B22" stroke="#79C0FF" stroke-width="1.5"/>
  <!-- Series impedance (Z) label line -->
  <line x1="-14" y1="0" x2="-7" y2="-6" stroke="#79C0FF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="-7" y1="-6" x2="0" y2="6" stroke="#79C0FF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="0" y1="6" x2="7" y2="-6" stroke="#79C0FF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7" y1="-6" x2="14" y2="0" stroke="#79C0FF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 1φ label -->
  <text x="0" y="10" font-size="5.5" fill="#79C0FF" text-anchor="middle" font-family="monospace">1φ</text>
  <!-- Terminal dots -->
  <circle cx="-30" cy="0" r="2.5" fill="#58A6FF"/>
  <circle cx="30" cy="0" r="2.5" fill="#58A6FF"/>
</svg>


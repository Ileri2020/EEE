<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -25 50 50" width="50" height="50">
  <!-- AC Fan: circle with rotating blades and AC label -->
  <!-- Leads -->
  <line x1="-24" y1="0" x2="-14" y2="0" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="0" x2="24" y2="0" stroke="#79C0FF" stroke-width="2" stroke-linecap="round"/>
  <!-- Fan outer circle -->
  <circle cx="0" cy="0" r="14" fill="#161B22" stroke="#79C0FF" stroke-width="2"/>
  <!-- Fan blades (4 blades) -->
  <path d="M0,0 Q5,-8 0,-12 Q-3,-6 0,0" fill="#79C0FF" opacity="0.85"/>
  <path d="M0,0 Q8,5 12,0 Q6,-3 0,0" fill="#79C0FF" opacity="0.85" transform="rotate(90 0 0)"/>
  <path d="M0,0 Q5,-8 0,-12 Q-3,-6 0,0" fill="#79C0FF" opacity="0.85" transform="rotate(180 0 0)"/>
  <path d="M0,0 Q8,5 12,0 Q6,-3 0,0" fill="#79C0FF" opacity="0.85" transform="rotate(270 0 0)"/>
  <!-- Center hub -->
  <circle cx="0" cy="0" r="3" fill="#161B22" stroke="#79C0FF" stroke-width="1.5"/>
  <!-- Terminal dots -->
  <circle cx="-24" cy="0" r="2.5" fill="#58A6FF"/>
  <circle cx="24" cy="0" r="2.5" fill="#58A6FF"/>
</svg>


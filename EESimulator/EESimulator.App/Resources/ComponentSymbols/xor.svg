  <line x1="-25" y1="10" x2="-14" y2="10" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="0" x2="25" y2="0" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -28 56 56" width="56" height="56">
  <!-- Synchronous Generator: G inside a circle with phase terminals -->
  <!-- Terminal leads A, B, C -->
  <line x1="-26" y1="-12" x2="-16" y2="-12" stroke="#56D364" stroke-width="2" stroke-linecap="round"/>
  <line x1="-26" y1="0" x2="-16" y2="0" stroke="#56D364" stroke-width="2" stroke-linecap="round"/>
  <line x1="-26" y1="12" x2="-16" y2="12" stroke="#56D364" stroke-width="2" stroke-linecap="round"/>
  <!-- Neutral terminal -->
  <line x1="16" y1="0" x2="26" y2="0" stroke="#56D364" stroke-width="2" stroke-linecap="round"/>
  <!-- Generator circle -->
  <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#56D364" stroke-width="2"/>
  <!-- G label -->
  <text x="0" y="5" font-size="12" fill="#56D364" text-anchor="middle" font-family="monospace" font-weight="bold">G</text>
  <!-- Sine wave accent inside -->
  <path d="M-7,2 Q-5,-4 -3,2 Q-1,8 1,2 Q3,-4 5,2 Q7,8 9,2" fill="none" stroke="#56D364" stroke-width="1" opacity="0.6"/>
  <!-- Terminal dots -->
  <circle cx="-26" cy="-12" r="2.5" fill="#58A6FF"/>
  <circle cx="-26" cy="0" r="2.5" fill="#58A6FF"/>
  <circle cx="-26" cy="12" r="2.5" fill="#58A6FF"/>
  <circle cx="26" cy="0" r="2.5" fill="#58A6FF"/>
</svg>


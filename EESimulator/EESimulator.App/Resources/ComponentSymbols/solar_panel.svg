<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -24 56 48" width="56" height="48">
  <!-- Solar Panel: panel grid with sun rays and DC output terminals -->
  <!-- Positive lead (top) -->
  <line x1="0" y1="-22" x2="0" y2="-14" stroke="#E3B341" stroke-width="2" stroke-linecap="round"/>
  <!-- Negative lead (bottom) -->
  <line x1="0" y1="14" x2="0" y2="22" stroke="#E3B341" stroke-width="2" stroke-linecap="round"/>
  <!-- Panel body -->
  <rect x="-16" y="-14" width="32" height="28" rx="2" ry="2" fill="#0D2137" stroke="#E3B341" stroke-width="1.5"/>
  <!-- Panel cell grid lines (3x2) -->
  <line x1="-5" y1="-14" x2="-5" y2="14" stroke="#E3B341" stroke-width="0.75" opacity="0.6"/>
  <line x1="5" y1="-14" x2="5" y2="14" stroke="#E3B341" stroke-width="0.75" opacity="0.6"/>
  <line x1="-16" y1="-5" x2="16" y2="-5" stroke="#E3B341" stroke-width="0.75" opacity="0.6"/>
  <line x1="-16" y1="4" x2="16" y2="4" stroke="#E3B341" stroke-width="0.75" opacity="0.6"/>
  <!-- Sun icon (top-right corner) -->
  <circle cx="20" cy="-16" r="4" fill="#E3B341" opacity="0.9"/>
  <line x1="20" y1="-22" x2="20" y2="-21" stroke="#E3B341" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="-20" x2="23" y2="-19.3" stroke="#E3B341" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="-16" x2="25" y2="-16" stroke="#E3B341" stroke-width="1.5" stroke-linecap="round"/>
  <!-- + and - signs -->
  <text x="0" y="-17" font-size="6" fill="#E3B341" text-anchor="middle" font-family="monospace">+</text>
  <text x="0" y="21" font-size="6" fill="#E3B341" text-anchor="middle" font-family="monospace">−</text>
  <!-- Terminal dots -->
  <circle cx="0" cy="-22" r="2.5" fill="#58A6FF"/>
  <circle cx="0" cy="22" r="2.5" fill="#58A6FF"/>
</svg>


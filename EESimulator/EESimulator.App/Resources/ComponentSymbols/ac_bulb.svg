<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -25 50 50" width="50" height="50">
  <!-- AC Bulb: circle with filament cross and AC wave -->
  <!-- Leads -->
  <line x1="-24" y1="0" x2="-14" y2="0" stroke="#E3B341" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="0" x2="24" y2="0" stroke="#E3B341" stroke-width="2" stroke-linecap="round"/>
  <!-- Bulb circle -->
  <circle cx="0" cy="0" r="14" fill="#161B22" stroke="#E3B341" stroke-width="2"/>
  <!-- Filament (crossed X) -->
  <line x1="-7" y1="-7" x2="7" y2="7" stroke="#E3B341" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="7" y1="-7" x2="-7" y2="7" stroke="#E3B341" stroke-width="1.75" stroke-linecap="round"/>
  <!-- AC ~ symbol at bottom -->
  <path d="M-5,10 Q-3,7 0,10 Q3,13 5,10" fill="none" stroke="#E3B341" stroke-width="1.25" stroke-linecap="round"/>
  <!-- Terminal dots -->
  <circle cx="-24" cy="0" r="2.5" fill="#58A6FF"/>
  <circle cx="24" cy="0" r="2.5" fill="#58A6FF"/>
</svg>


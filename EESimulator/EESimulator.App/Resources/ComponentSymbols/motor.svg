<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -28 56 56" width="56" height="56">
  <!-- Induction Motor: M inside a circle with phase terminals -->
  <!-- Terminal leads A, B, C -->
  <line x1="-26" y1="-12" x2="-16" y2="-12" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <line x1="-26" y1="0" x2="-16" y2="0" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <line x1="-26" y1="12" x2="-16" y2="12" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <!-- Neutral terminal -->
  <line x1="16" y1="0" x2="26" y2="0" stroke="#FFA657" stroke-width="2" stroke-linecap="round"/>
  <!-- Motor circle (double ring for motor convention) -->
  <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#FFA657" stroke-width="2"/>
  <circle cx="0" cy="0" r="13" fill="none" stroke="#FFA657" stroke-width="0.75" opacity="0.4"/>
  <!-- M label -->
  <text x="0" y="5" font-size="12" fill="#FFA657" text-anchor="middle" font-family="monospace" font-weight="bold">M</text>
  <!-- Rotation arrow -->
  <path d="M 6,-10 A 10,10 0 0,1 10,-6" fill="none" stroke="#FFA657" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="10,-6 13,-8 11,-3" fill="#FFA657" opacity="0.8"/>
  <!-- Terminal dots -->
  <circle cx="-26" cy="-12" r="2.5" fill="#58A6FF"/>
  <circle cx="-26" cy="0" r="2.5" fill="#58A6FF"/>
  <circle cx="-26" cy="12" r="2.5" fill="#58A6FF"/>
  <circle cx="26" cy="0" r="2.5" fill="#58A6FF"/>
</svg>

